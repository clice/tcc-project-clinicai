services:
  chk03-db:
    image: postgres:16
    environment:
      POSTGRES_DB: clinicai_chk03
      POSTGRES_USER: clinicai_chk03
      POSTGRES_PASSWORD: clinicai_chk03
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicai_chk03 -d clinicai_chk03"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - chk03_postgres_data:/var/lib/postgresql/data

  chk03-runner:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://clinicai_chk03:clinicai_chk03@chk03-db:5432/clinicai_chk03
      SECRET_KEY: chk03-disposable-secret-key
      ALGORITHM: HS256
      SEED_MODE: bootstrap
      UPLOAD_DIR: /tmp/clinicai-chk03-uploads
      AI_SERVICE_URL: http://unused-ai:8001
    depends_on:
      chk03-db:
        condition: service_healthy
    volumes:
      - ./reports/chk-03:/reports

volumes:
  chk03_postgres_data:
