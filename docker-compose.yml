services:
  model-downloader:
    image: python:3.12-alpine
    profiles: ["models"]
    environment:
      MODEL_RELEASE_REPOSITORY: ${MODEL_RELEASE_REPOSITORY:-clice/tcc-project-clinicai}
      MODEL_RELEASE_TAG: ${MODEL_RELEASE_TAG:-models-v0.1.0}
      MODEL_RELEASE_MANIFEST: ${MODEL_RELEASE_MANIFEST:-manifesto_modelos.json}
      MODEL_DESTINATION_DIR: /models/gastrointestinal
    volumes:
      - ./scripts/download_models.py:/app/download_models.py:ro
      - ./ai/models/exported:/models
    command: python /app/download_models.py
    
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinicai}
      POSTGRES_USER: ${POSTGRES_USER:-clinicai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env e defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinicai}:${POSTGRES_PASSWORD:?Copie .env.example para .env e defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clinicai}
      AI_SERVICE_URL: http://ai:8001
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: ./ai
    restart: unless-stopped
    volumes:
      - ./ai:/app
      - torch_cache:/root/.cache/torch
    ports:
      - "127.0.0.1:${AI_PORT:-8001}:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    # GPU é opcional. O código já cai para CPU sozinho (torch.cuda.is_available()).
    # Para usar GPU NVIDIA localmente, suba com:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    command: npm start -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  uploads_data:
  torch_cache:
