services:
  db:
    image: postgres:16
    container_name: clinicai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicai
      POSTGRES_USER: clinicai
      POSTGRES_PASSWORD: clinicai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: