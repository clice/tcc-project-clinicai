services:
  db:
    image: postgres:16
    container_name: clinicai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicai
      POSTGRES_USER: clinicai
      POSTGRES_PASSWORD: clinicai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: clinicai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ai
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: ./ai
    container_name: clinicai_ai
    restart: unless-stopped
    volumes:
      - ./ai:/app
      - ai_models:/app/app/models
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: ./frontend
    container_name: clinicai_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm start -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  uploads_data:
  ai_models: