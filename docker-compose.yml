services:
  model-downloader:
    image: python:3.12-alpine
    profiles: ["models"]
    environment:
      MODEL_RELEASE_REPOSITORY: ${MODEL_RELEASE_REPOSITORY:-clice/tcc-project-clinicai}
      MODEL_RELEASE_TAG: ${MODEL_RELEASE_TAG:-models-v0.1.2}
      MODEL_RELEASE_MANIFEST: ${MODEL_RELEASE_MANIFEST:-manifesto_modelos.json}
      MODEL_DESTINATION_DIR: /models/gastrointestinal
    volumes:
      - ./scripts/download_models.py:/app/download_models.py:ro
      - ./ai/models/exported:/models
    command: python /app/download_models.py
    
  db:
    image: postgres:16
    container_name: clinicai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicai
      POSTGRES_USER: clinicai
      POSTGRES_PASSWORD: clinicai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: clinicai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CLINICAI_DATA_DIR: /clinicai-data
    volumes:
      - ./backend:/app
      - ./data:/clinicai-data
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ai
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: ./ai
    container_name: clinicai_ai
    restart: unless-stopped
    volumes:
      - ./ai:/app
      - ./ai/models:/app/models
      - torch_cache:/root/.cache/torch
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    # GPU é opcional. O código já cai para CPU sozinho (torch.cuda.is_available()).
    # Para usar GPU NVIDIA localmente, suba com:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up

  frontend:
    build:
      context: ./frontend
    container_name: clinicai_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm start -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  torch_cache:
