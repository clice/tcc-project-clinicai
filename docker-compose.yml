services:
  db:
    image: postgres:16
    container_name: clinicai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinicai
      POSTGRES_USER: clinicai
      POSTGRES_PASSWORD: clinicai123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    frontend:
      build:
        context: ./frontend
      container_name: clinicai_frontend
      restart: unless-stopped
      env_file:
        - ./frontend/.env
      volumes:
        - ./frontend:/app
        - /app/node_modules
      ports:
        - "3000:3000"
      depends_on:
        - backend
      command: npm start -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data: